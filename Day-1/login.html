<!DOCTYPE html>
<html lang="en">
    <head>
        <title>form in Html</title>
        <style>
            form {
                width: 100px;
                background-image: url("https://img.magnific.com/free-vector/digital-technology-background-with-blue-orange-light-effect_1017-27423.jpg?semt=ais_hybrid&w=740&q=80");
                background-size: cover;
            }
        </style>
    </head>
    <body>
        <form action="">
            <fieldset>
                <legend align = "center">Login Form</legend>
                <label for="username">UserName:</label>
                <input type="text" minlength="3"maxlength="10" placeholder="Enter your username" required id="username" name="username">
                <br><br>
                <label for="password">Password:</label>
                <input type="password" placeholder="Enter your password" required id="password" name="password">
                <br><br>
                <button type="submit">login</button>
                <br><br>
                <button type="reset">cancel</button>
            </fieldset>
        </form>
    </body>
</html>
